<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogue | GL Bajaj Bookstore</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f0fdf4; color: #0f172a; display: flex; flex-direction: column; min-height: 100vh; }
        .top-bar { background-color: #0f3d38; color: #ffffff; text-align: center; padding: 9px; font-size: 13px; font-weight: bold; }
        .header { background-color: #114b43; display: flex; justify-content: space-between; align-items: center; padding: 15px 40px; border-bottom: 1px solid rgba(255,255,255,0.15); }
        .logo-area { display: flex; align-items: center; gap: 15px; }
        .logo-area img { width: 55px; height: 55px; object-fit: contain; border-radius: 8px; background: white; padding: 4px; }
        .logo-area h1 { color: #ffffff; font-size: 21px; font-weight: bold; }
        .logo-area h1 span { color: #fb923c; }
        .nav-links { display: flex; align-items: center; gap: 25px; }
        .nav-links a { color: #ffffff; text-decoration: none; font-size: 15px; font-weight: 600; }
        .nav-links a:hover { color: #fb923c; }
        .main-wrapper { display: flex; flex: 1; padding: 30px 40px; gap: 30px; max-width: 1400px; margin: 0 auto; width: 100%; }
        .content-area { flex: 1; background: #ffffff; border-radius: 16px; padding: 35px; border: 1px solid #cbd5e1; }
        .filter-controls { display: flex; gap: 12px; margin-bottom: 25px; }
        .filter-controls input { flex: 1; padding: 11px 15px; border: 1px solid #94a3b8; border-radius: 8px; }
        .books-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .book-card { border: 1px solid #cbd5e1; border-radius: 12px; overflow: hidden; background: #ffffff; display: flex; flex-direction: column; }
        .book-img-box { background: #ccfbf1; height: 130px; display: flex; justify-content: center; align-items: center; font-size: 40px; }
        .book-info { padding: 15px; display: flex; flex-direction: column; flex: 1; }
        .book-title { font-size: 15px; font-weight: bold; color: #0f172a; margin-bottom: 4px; }
        .book-price { font-size: 16.5px; font-weight: bold; color: #0f3d38; }
        .btn-add { background-color: #f97316; color: white; border: none; padding: 6px 14px; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .footer { background-color: #114b43; color: #ffffff; text-align: center; padding: 20px; font-size: 13.5px; margin-top: auto; }
        .footer p { margin: 4px 0; }
        .footer a { color: #fb923c; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="top-bar">GL BAJAJ INSTITUTE OF TECHNOLOGY AND MANAGEMENT</div>
    <header class="header">
        <div class="logo-area">
            <img src="images/logo.png" alt="GL Bajaj Logo">
            <h1>GL <span>BAJAJ</span> BOOKSTORE</h1>
        </div>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
            <a href="catalogue.html" class="active">Catalogue</a>
            <a href="cart.html">Cart</a>
        </nav>
    </header>
    <div class="main-wrapper">
        <main class="content-area">
            <h2>All Books Catalogue</h2>
            <div class="filter-controls">
                <input type="text" id="searchInput" placeholder="Search by title or author...">
            </div>
            <div class="books-grid" id="booksGrid"></div>
        </main>
    </div>
    <footer class="footer">
        <p>GL BAJAJ INSTITUTE OF TECHNOLOGY AND MANAGEMENT</p>
        <p>Name: Ronak | Roll No: 2501920110313</p>
        <p>GitHub: <a href="https://github.com/ronaksinghal2006-hash/GLBAJAJBOOKSTORE" target="_blank">github.com/ronaksinghal2006-hash/GLBAJAJBOOKSTORE</a></p>
    </footer>
</body>
</html>
