<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | GL Bajaj Bookstore</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f0fdf4; color: #0f172a; display: flex; flex-direction: column; min-height: 100vh; }
        .top-bar { background-color: #0f3d38; color: #ffffff; text-align: center; padding: 9px; font-size: 13px; font-weight: bold; }
        .header { background-color: #114b43; display: flex; justify-content: space-between; align-items: center; padding: 15px 40px; border-bottom: 1px solid rgba(255,255,255,0.15); }
        .logo-area { display: flex; align-items: center; gap: 15px; }
        .logo-area img { width: 55px; height: 55px; object-fit: contain; border-radius: 8px; background: white; padding: 4px; }
        .logo-area h1 { color: #ffffff; font-size: 21px; font-weight: bold; }
        .logo-area h1 span { color: #fb923c; }
        .nav-links { display: flex; align-items: center; gap: 25px; }
        .nav-links a { color: #ffffff; text-decoration: none; font-size: 15px; font-weight: 600; }
        .nav-links a:hover { color: #fb923c; }
        .nav-links a.active { background-color: #0b3832; padding: 6px 14px; border-radius: 20px; }
        .main-wrapper { display: flex; flex: 1; justify-content: center; align-items: center; padding: 40px; }
        .form-card { background: white; padding: 40px; border-radius: 16px; border: 1px solid #cbd5e1; width: 100%; max-width: 400px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .form-card h2 { color: #0f3d38; margin-bottom: 20px; text-align: center; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 14px; color: #334155; }
        .input-group input { width: 100%; padding: 11px 15px; border: 1px solid #94a3b8; border-radius: 8px; font-size: 14px; }
        .btn-submit { width: 100%; background-color: #f97316; color: white; border: none; padding: 12px; font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 15px; }
        .btn-submit:hover { background-color: #ea580c; }
        .footer { background-color: #114b43; color: #ffffff; text-align: center; padding: 20px; font-size: 13.5px; margin-top: auto; font-weight: 500; }
        .footer p { margin: 4px 0; }
        .footer a { color: #fb923c; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="top-bar">GL BAJAJ INSTITUTE OF TECHNOLOGY AND MANAGEMENT</div>
    <header class="header">
        <div class="logo-area">
            <img src="images/logo.png" alt="GL Bajaj Logo">
            <h1>GL <span>BAJAJ</span> BOOKSTORE</h1>
        </div>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="login.html" class="active">Login</a>
            <a href="register.html">Register</a>
            <a href="catalogue.html">Catalogue</a>
            <a href="cart.html">Cart</a>
        </nav>
    </header>
    <div class="main-wrapper">
        <div class="form-card">
            <h2>Student Login</h2>
            <form onsubmit="event.preventDefault(); alert('Login successful!');">
                <div class="input-group">
                    <label>Email / Roll Number</label>
                    <input type="text" placeholder="Enter roll no or email" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn-submit">Login</button>
            </form>
        </div>
    </div>
    <footer class="footer">
        <p>GL BAJAJ INSTITUTE OF TECHNOLOGY AND MANAGEMENT</p>
        <p>Name: Ronak | Roll No: 2501920110313</p>
        <p>GitHub: <a href="https://github.com/ronaksinghal2006-hash/GLBAJAJBOOKSTORE" target="_blank">github.com/ronaksinghal2006-hash</a></p>
    </footer>
</body>
</html>
